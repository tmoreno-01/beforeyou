 ivec2 p=ivec2(gl_FragCoord.xy);vec2 z=vec2(p);
 vec4 m=get(field,p);int id=int(round(m.r*255.));int gene=int(round(m.g*255.));float speed=m.b,porosity=m.a;
 int salt=id*223+int(key)*19;float t=float(tick);

const palettes=[['#101010','#e7e2ce','#c5ff00','#445b00','#6b6e63','#fc6b35'],['#101b44','#f2eee3','#214cff','#7c94ea','#131315','#e2aa56'],['#111113','#eee9e5','#ff3150','#822036','#77757b','#f7ac9c'],['#131a16','#f1eada','#00e6b0','#1c735b','#738077','#d5bd69'],['#2b1a32','#f1ab8b','#f33b19','#8b65a9','#f4dace','#161016'],['#e9e5d5','#1c29a5','#17171c','#9caae5','#f36a25','#a8a08c']];
const R=n=>Math.floor(rand()*n), pick=a=>a[R(a.length)];
function splitBox(box,ratio,vertical){

 if(kind===10){let g=3+R(6);for(let j=0;j<h;j+=g)for(let i=0;i<w;i+=g){if(rand()<.5)rect(i,j,g,1,fg);else rect(i,j,1,g,fg);if(rand()<.08)rect(i,j,2,2,accent)}}
 if(kind===11){for(let j=0;j<h;j+=pitch)for(let i=0;i<w;i+=pitch){let v=Math.max(1,Math.floor((.5+.5*Math.sin(i*.028+j*.053+phase))*pitch));rect(i,j,v,1+Math.floor(v/3),fg)}}
 if(kind===12){let bw=Math.max(2,Math.floor(w/(3+R(13))));for(let i=0;i<w;i+=bw){let hh=Math.floor(h*(.12+rand()*.88));rect(i,rand()<.5?0:h-hh,Math.max(1,bw-1),hh,rand()<.8?fg:accent)}}
 if(kind===13){let g=3+R(5);for(let j=0;j<h;j+=g)for(let i=0;i<w;i+=g){let v=(Math.floor(i/g)^Math.floor(j/g)^phase)%11;if(v<4)rect(i,j,g-1,g-1,fg)}}

 if(kind===15){let g=3+R(9);for(let j=0;j<h;j+=g){let q=Math.floor(w*(.5+.43*Math.sin(j*.023+phase)));rect(0,j,q,line,fg);rect(q,j,Math.max(1,g),g,accent)}}

 for(let yy=0;yy<h;yy++){
  const i=(h-1-yy)*w*4,k=((H-1-y-yy)*W+x)*4;

function initAtlas(){

 else{let near=boxes.filter(q=>q!==b&&((Math.abs(q.x-b.x)<W*.20&&Math.abs(q.y-b.y)<H*.20)||adjacent(b,q)));for(const q of near.slice(0,4)){q.gene=b.gene;q.porosity=180+R(75);genome(q)}event='CONTAGION'}

 nextEvent=age+(force?2:2.5+rand()*8);
}
function rebuild(change=false){
 if(change||!seed)seed=(crypto.getRandomValues(new Uint32Array(1))[0]>>>0)||1;
 rand=rng(seed);
 let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(2,Math.round(r.width*d));canvas.height=Math.max(2,Math.round(r.height*d));
 let scale=Math.min(1,1400/canvas.width,1000/canvas.height);W=Math.max(2,Math.round(canvas.width*scale*quality));H=Math.max(2,Math.round(canvas.height*scale*quality));
 [...targets,base,regions,archive].filter(Boolean).forEach(t=>gl.deleteTexture(t));fb.forEach(t=>gl.deleteFramebuffer(t));
 baseData=new Uint8Array(W*H*4);fieldData=new Uint8Array(W*H*4);memoryData=new Uint8Array(W*H*4);initAtlas();

 let initial=baseData.slice();for(let i=3;i<initial.length;i+=4)initial[i]=0;
 targets=[texture(initial),texture(initial)];fb=targets.map(t=>{let a=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,a);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Framebuffer incomplete');return a});
 read=0;step=0;acc=0;last=0;age=0;epoch=0;events=0;nextEvent=3+rand()*4;el('seed').textContent='SEED '+seed+' / '+W+'×'+H;el('stats').textContent=boxes.length+' CELLS / GERMINATION';draw();
}
function mutate(){
 gl.useProgram(sim);gl.bindFramebuffer(gl.FRAMEBUFFER,fb[1-read]);gl.viewport(0,0,W,H);
 bind(targets[read],0,su.prev);bind(base,1,su.original);bind(regions,2,su.field);bind(archive,3,su.memoryTex);
 gl.uniform2i(su.dim,W,H);if(++step>=1000000){step=0;epoch++}gl.uniform1i(su.tick,step);gl.uniform1f(su.key,(seed+epoch*131)%997);
 gl.drawArrays(gl.TRIANGLES,0,3);read=1-read;
}
function draw(){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(show);bind(targets[read],0,du.tex);gl.uniform2f(du.view,canvas.width,canvas.height);gl.drawArrays(gl.TRIANGLES,0,3);}
function frame(now){let dt=last?Math.min(now-last,100):0;last=now;if(!paused&&!document.hidden){age+=dt/1000;if(age>=nextEvent)evolve();acc=Math.min(acc+dt,100);let n=0;while(acc>=1000/30&&n<2){mutate();acc-=1000/30;n++;}if(n)draw()}requestAnimationFrame(frame)}
el('new').onclick=()=>rebuild(true);el('evolve').onclick=()=>{evolve(true);if(paused){mutate();draw()}};el('hide').onclick=()=>document.querySelector('main').classList.add('clean');canvas.addEventListener('dblclick',()=>document.querySelector('main').classList.toggle('clean'));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('main').classList.remove('clean');if(e.key==='h')document.querySelector('main').classList.toggle('clean')});el('layout').onchange=()=>rebuild(false);el('palette').onchange=()=>rebuild(false);el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Resume':'Pause';};el('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(canvas.requestFullscreen)canvas.requestFullscreen().catch(e=>el('err').textContent=e.message);else el('err').textContent='Fullscreen not supported';};
let timer;new ResizeObserver(()=>{clearTimeout(timer);timer=setTimeout(()=>{let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);let w=Math.max(2,Math.round(r.width*d)),h=Math.max(2,Math.round(r.height*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;draw()}},80)}).observe(canvas);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();paused=true;el('err').textContent='GPU context lost. Reload to restart.'});
try{rebuild(true);requestAnimationFrame(frame)}catch(e){el('err').textContent=e.message;throw e}
